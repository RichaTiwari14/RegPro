<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FFFFFF" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet" />
    <script>document.documentElement.classList.add('js')</script>
    <!--app-head-->
    <style>
      /* ── Cinematic loader (plain CSS so it shows before the app loads) ── */
      html.rp-loading, html.rp-loading body { overflow: hidden; }
      #rp-loader {
        position: fixed; inset: 0; z-index: 9999; overflow: hidden;
        display: flex; align-items: center; justify-content: center;
        background: #ffffff;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        transition: opacity .7s ease .3s;
      }
      #rp-loader .mist { display: none; }
      #rp-loader .glow { display: none; }
      #rp-loader .ridge { display: none; }
      #rp-loader .inner { position: relative; text-align: center; color: #171a21; transition: opacity .5s ease, transform .6s cubic-bezier(.16,1,.3,1); }
      #rp-loader .mark { width: 96px; height: auto; display: block; margin: 0 auto; }
      #rp-loader .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); animation: rp-rise .9s cubic-bezier(.16,1,.3,1) forwards; }
      #rp-loader .tick { stroke-dasharray: 140; stroke-dashoffset: 140; animation: rp-draw 1s cubic-bezier(.65,0,.35,1) .6s forwards; }
      #rp-loader .head { opacity: 0; transform-box: fill-box; transform-origin: center; transform: scale(.4); animation: rp-pop .45s cubic-bezier(.34,1.56,.64,1) 1.5s forwards; }
      #rp-loader .word { margin-top: 26px; font-family: 'Montserrat', 'Inter', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -.01em; color: #0b2a5b; opacity: 0; transform: translateY(10px); animation: rp-word 1s cubic-bezier(.16,1,.3,1) .5s forwards; }
      #rp-loader .tag { margin-top: 10px; font-size: 14px; color: #55627a; opacity: 0; animation: rp-fade 1s ease 1.2s forwards; }
      #rp-loader .bar-track { width: 160px; height: 2px; border-radius: 2px; margin: 30px auto 0; background: #eef1f5; overflow: hidden; }
      #rp-loader .bar-fill { height: 100%; width: 100%; transform: scaleX(0); transform-origin: left; background: linear-gradient(90deg, #0b2a5b, #d6a21f); animation: rp-progress 2s cubic-bezier(.65,0,.35,1) .2s forwards; }
      #rp-loader.rp-out { opacity: 0; }
      #rp-loader.rp-out .inner { opacity: 0; transform: translateY(-30px); }
      @keyframes rp-rise { to { transform: scaleY(1); } }
      @keyframes rp-draw { to { stroke-dashoffset: 0; } }
      @keyframes rp-pop { to { opacity: 1; transform: scale(1); } }
      @keyframes rp-word { to { opacity: 1; transform: none; } }
      @keyframes rp-fade { to { opacity: 1; } }
      @keyframes rp-progress { to { transform: scaleX(1); } }
      @keyframes rp-drift { from { transform: translate3d(-6%,0,0); } to { transform: translate3d(6%,-4%,0); } }
      @media (prefers-reduced-motion: reduce) {
        #rp-loader *, #rp-loader { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .3s !important; transition-delay: 0s !important; }
      }
    </style>

  </head>
  <body>
    <div id="rp-loader" aria-hidden="true">
      <div class="mist" style="width:55vw;height:40vh;left:-10vw;top:12vh"></div>
      <div class="mist" style="width:50vw;height:35vh;right:-12vw;top:40vh;animation-delay:-4s"></div>
      <div class="glow"></div>
      <div class="inner">
        <svg class="mark" viewBox="0 0 120 100">
          <defs><clipPath id="rp-ld-clip"><polygon points="0,0 100,0 100,13 30,79 0,51" /></clipPath></defs>
          <g clip-path="url(#rp-ld-clip)" fill="#0B2A5B">
            <rect class="bar" x="22" y="40" width="10" height="60" style="animation-delay:.15s" />
            <rect class="bar" x="36" y="28" width="10" height="72" style="animation-delay:.3s" />
            <rect class="bar" x="50" y="16" width="10" height="84" style="animation-delay:.45s" />
          </g>
          <polyline class="tick" points="6,66 30,88 98,24" fill="none" stroke="#D6A21F" stroke-width="10" />
          <polygon class="head" points="110,12 92.2,14.2 107.8,29.8" fill="#D6A21F" />
        </svg>
        <div class="word">REGPRO</div>
        <div class="tag">Register. Comply. Grow.</div>
        <div class="bar-track"><div class="bar-fill"></div></div>
      </div>
      <svg class="ridge" viewBox="0 0 1440 200" preserveAspectRatio="none">
        <path d="M0 120 L160 70 L300 100 L460 40 L620 95 L780 55 L940 110 L1100 60 L1280 100 L1440 70 L1440 200 L0 200Z" fill="#081f44" opacity=".8" />
        <path d="M0 160 L200 125 L380 150 L560 115 L760 155 L960 125 L1160 158 L1340 130 L1440 145 L1440 200 L0 200Z" fill="#05142d" />
      </svg>
    </div>
    <script>
      (function () {
        var el = document.getElementById('rp-loader');
        if (!el) return;
        var seen = false;
        try { seen = sessionStorage.getItem('rp-loaded') === '1'; } catch (e) {}
        // Show the full intro once per visit; later page loads skip it.
        if (seen) { el.parentNode.removeChild(el); return; }
        var root = document.documentElement;
        root.classList.add('rp-loading');
        var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        var MIN = reduce ? 400 : 2300, MAX = 6000, start = Date.now(), done = false;
        function hide() {
          if (done) return;
          done = true;
          setTimeout(function () {
            el.classList.add('rp-out');
            root.classList.remove('rp-loading');
            window.dispatchEvent(new Event('rp:loaded'));
            try { sessionStorage.setItem('rp-loaded', '1'); } catch (e) {}
            setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 1600);
          }, Math.max(0, MIN - (Date.now() - start)));
        }
        if (document.readyState === 'complete') hide();
        else window.addEventListener('load', hide);
        setTimeout(hide, MAX);
      })();
    </script>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/entry-client.tsx"></script>
  </body>
</html>
